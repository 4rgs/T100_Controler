version: '3.8'

services:
  t100-client:
    image: nginx:alpine
    container_name: t100-web-client
    ports:
      - "8080:80"
    command: |
      sh -c "
        apk add --no-cache wget &&
        wget -O /usr/share/nginx/html/index.html https://raw.githubusercontent.com/4rgs/T100_Controler/develop/client.html &&
        nginx -g 'daemon off;'
      "
    restart: unless-stopped
    labels:
      - "casaos.name=T100 Web Controller"
      - "casaos.description=Cliente web para control del robot T100"
      - "casaos.category=Tools"
      - "casaos.icon=🤖"
      - "casaos.main=http://localhost:8080"
