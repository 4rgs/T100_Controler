version: '3.8'

services:
  t100-client:
    image: httpd:alpine
    container_name: t100-web-client
    ports:
      - "8084:80"
    environment:
      - GITHUB_URL=https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/client.html
    command: 
      - sh
      - -c
      - |
        mkdir -p /usr/local/apache2/htdocs/assets &&
        wget -O /usr/local/apache2/htdocs/index.html https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/client.html &&
        wget -O /usr/local/apache2/htdocs/manifest.json https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/manifest.json &&
        wget -O /usr/local/apache2/htdocs/sw.js https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/sw.js &&
        wget -O /usr/local/apache2/htdocs/assets/favicon.svg https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/assets/favicon.svg &&
        wget -O /usr/local/apache2/htdocs/assets/icon-192.svg https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/assets/icon-192.svg &&
        wget -O /usr/local/apache2/htdocs/assets/icon-512.svg https://raw.githubusercontent.com/4rgs/T100_Controler/develop/web-client/assets/icon-512.svg &&
        httpd-foreground
    restart: unless-stopped
    labels:
      - "casaos.name=T100 Web Controller"
      - "casaos.description=Cliente web para control del robot T100"
      - "casaos.category=Utilities"
      - "casaos.icon=https://cdn-icons-png.flaticon.com/512/2933/2933245.png"
      - "casaos.port_map=8084"
      - "casaos.scheme=http"
